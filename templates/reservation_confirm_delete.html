{% extends "base.html" %}

{% block title %}Delete Reservation{% endblock title %}

{% block content %}
<h2>Delete Reservation</h2>
<p>Are you sure you want to delete this reservation with <strong>{{ reservation.tutor.username }}</strong> on {{ reservation.day }}?</p>

<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Confirm Delete</button>
    <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock content %}
