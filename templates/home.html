{% extends "base.html" %}

{% block title %}Home{% endblock title %}

{% block content %}
{% if user.is_authenticated %}
<p>Hi {{user.username}}!</p>
<a href="{% url "add_availability" %}">Manage My Availability</a>
<form action="{% url 'logout' %}" method="post">
    {% csrf_token %}
    <button type="submit">Log Out</button>
</form>
{% else %}
<p>You are not logged in</p>
<a href="{% url 'login' %}">Log In</a> | <!--The "|" is included in the book, might need to be removed-->
<a href="{% url 'signup' %}">Sign Up</a>
{% endif %}
{% endblock content %}
